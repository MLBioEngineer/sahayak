; ================================================================================================
; সহায়ক (Sahayak) — ESP32 AD8232 PlatformIO Configuration
; ================================================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Baud Rate
monitor_speed = 115200

; CPU Frequency: 240 MHz for maximum dual-core performance
board_build.f_cpu = 240000000L

; Flash Frequency & Mode
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Upload settings
upload_speed = 921600

; Compiler flags for production stability
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D CONFIG_FREERTOS_HZ=1000
